# Config de nginx para servir la SPA compilada.
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # EL punto clave de una SPA con React Router: rutas como /catalogo o
  # /producto/x NO existen como archivos en disco. Sin esto, recargar esas
  # URLs daría 404. `try_files` intenta el archivo pedido, luego el directorio,
  # y si no existe, entrega index.html para que React Router resuelva la ruta.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Los assets con hash en el nombre (main-AbC123.js) son inmutables: cachea fuerte.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
